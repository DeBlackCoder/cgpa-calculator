<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Analytics/Chart illustration -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#F9FAFB"/>
  
  <!-- Chart container -->
  <rect x="50" y="50" width="500" height="300" rx="15" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Axes -->
  <line x1="100" y1="320" x2="500" y2="320" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="320" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">5.0</text>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">4.0</text>
  <text x="80" y="205" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">3.0</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">2.0</text>
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">1.0</text>
  
  <!-- X-axis labels -->
  <text x="150" y="340" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Y1</text>
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Y2</text>
  <text x="350" y="340" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Y3</text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Y4</text>
  
  <!-- Line chart with area fill -->
  <path d="M 100 250 L 150 220 L 200 200 L 250 180 L 300 160 L 350 140 L 400 120 L 450 100 L 500 90" 
        stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M 100 250 L 150 220 L 200 200 L 250 180 L 300 160 L 350 140 L 400 120 L 450 100 L 500 90 L 500 320 L 100 320 Z" 
        fill="url(#grad2)"/>
  
  <!-- Data points -->
  <circle cx="100" cy="250" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="150" cy="220" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="200" cy="200" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="250" cy="180" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="300" cy="160" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="350" cy="140" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="400" cy="120" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="450" cy="100" r="5" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="500" cy="90" r="6" fill="#3B82F6"/>
  
  <!-- Trend arrow -->
  <path d="M 480 110 L 520 110 L 520 70 L 520 110 L 510 100" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
