<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calculator/Grade concept illustration -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="200" cy="150" r="80" fill="#EFF6FF" opacity="0.5"/>
  <circle cx="600" cy="400" r="100" fill="#DBEAFE" opacity="0.5"/>
  <circle cx="700" cy="200" r="60" fill="#BFDBFE" opacity="0.5"/>
  
  <!-- Main calculator/document -->
  <rect x="250" y="100" width="300" height="400" rx="20" fill="white" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Display screen -->
  <rect x="280" y="140" width="240" height="80" rx="10" fill="#EFF6FF"/>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3B82F6" text-anchor="middle">5.0</text>
  
  <!-- Grade bars -->
  <rect x="280" y="250" width="180" height="20" rx="10" fill="#10B981"/>
  <text x="470" y="265" font-family="Arial, sans-serif" font-size="14" fill="#374151">A</text>
  
  <rect x="280" y="290" width="150" height="20" rx="10" fill="#3B82F6"/>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="14" fill="#374151">B</text>
  
  <rect x="280" y="330" width="120" height="20" rx="10" fill="#F59E0B"/>
  <text x="410" y="345" font-family="Arial, sans-serif" font-size="14" fill="#374151">C</text>
  
  <!-- Stars/achievement icons -->
  <circle cx="320" cy="420" r="25" fill="#FEF3C7"/>
  <path d="M320 405 L325 415 L336 416 L328 424 L330 435 L320 430 L310 435 L312 424 L304 416 L315 415 Z" fill="#F59E0B"/>
  
  <circle cx="400" cy="420" r="25" fill="#FEF3C7"/>
  <path d="M400 405 L405 415 L416 416 L408 424 L410 435 L400 430 L390 435 L392 424 L384 416 L395 415 Z" fill="#F59E0B"/>
  
  <circle cx="480" cy="420" r="25" fill="#FEF3C7"/>
  <path d="M480 405 L485 415 L496 416 L488 424 L490 435 L480 430 L470 435 L472 424 L464 416 L475 415 Z" fill="#F59E0B"/>
  
  <!-- Floating elements -->
  <circle cx="150" cy="300" r="15" fill="#3B82F6" opacity="0.3"/>
  <circle cx="650" cy="300" r="20" fill="#10B981" opacity="0.3"/>
  <rect x="100" y="450" width="30" height="30" rx="5" fill="#F59E0B" opacity="0.3"/>
  <rect x="650" y="120" width="35" height="35" rx="5" fill="#3B82F6" opacity="0.3"/>
</svg>
